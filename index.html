<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Control · Diana</title>
<style>
:root {
  --rosa: #E8197A;
  --rosa-light: #F7B8D8;
  --rosa-dark: #B5105C;
  --rosa-bg: #FDF0F6;
  --gris: #3D3D3D;
  --gris-mid: #6B6B6B;
  --gris-light: #F2F2F2;
  --gris-border: #E0E0E0;
  --white: #FFFFFF;
  --text: #2A2A2A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F4F4F4; color: var(--text); min-height: 100vh; }
.app { max-width: 980px; margin: 0 auto; padding: 0 0 3rem; }

/* ── Header corporativo ── */
.corp-header { background: var(--gris); padding: 0; display: flex; align-items: stretch; }
.corp-logo-band { background: var(--white); display: flex; align-items: center; justify-content: center; padding: 14px 24px; }
.corp-logo-band img { height: 52px; display: block; }
.corp-title-band { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 24px; border-left: 3px solid var(--rosa); }
.corp-title { font-size: 17px; font-weight: 700; color: var(--white); letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.2; }
.corp-subtitle { font-size: 11px; color: var(--rosa-light); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 3px; }
.corp-week-band { display: flex; align-items: center; padding: 0 20px; }
.week-input { font-size: 12px; padding: 6px 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; color: var(--white); width: 170px; text-align: center; font-family: inherit; }
.week-input::placeholder { color: rgba(255,255,255,0.5); }

/* ── Tabs ── */
.tabs-wrap { background: var(--white); border-bottom: 2px solid var(--gris-border); padding: 0 1.5rem; }
.tabs { display: flex; gap: 0; overflow-x: auto; }
.tab-btn { padding: 13px 16px; font-size: 12px; font-weight: 600; border: none; background: transparent; cursor: pointer; color: var(--gris-mid); display: flex; align-items: center; gap: 6px; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.15s; white-space: nowrap; font-family: inherit; letter-spacing: 0.02em; }
.tab-btn.active { color: var(--rosa); border-bottom-color: var(--rosa); }
.tab-btn:hover:not(.active) { color: var(--gris); background: var(--rosa-bg); }
.panel { display: none; }
.panel.active { display: block; }
.panel-inner { padding: 1.5rem; }

/* ── Typography ── */
.section-title { font-size: 10px; font-weight: 700; color: var(--gris-mid); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; display: inline-block; width: 3px; height: 12px; background: var(--rosa); border-radius: 2px; }
.section-note { font-weight: 400; font-size: 10px; color: #bbb; text-transform: none; letter-spacing: 0; }
.divider { border: none; border-top: 1px solid var(--gris-border); margin: 1.25rem 0; }

/* ── Métricas ── */
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-bottom: 0.75rem; }
.metric-card { background: var(--white); border: 1px solid var(--gris-border); border-radius: 10px; padding: 14px; position: relative; border-top: 3px solid var(--rosa); }
.metric-card:hover .metric-edit-btn, .metric-card:hover .metric-del-btn { opacity: 1; }
.metric-edit-btn { position: absolute; top: 8px; right: 8px; background: none; border: none; cursor: pointer; font-size: 13px; color: #ccc; padding: 2px 4px; border-radius: 5px; opacity: 0; transition: opacity 0.15s; }
.metric-edit-btn:hover { color: var(--gris); background: var(--gris-light); }
.metric-del-btn { position: absolute; top: 8px; right: 30px; background: none; border: none; cursor: pointer; font-size: 13px; color: #ccc; padding: 2px 4px; border-radius: 5px; opacity: 0; transition: opacity 0.15s; }
.metric-del-btn:hover { color: var(--rosa-dark); background: var(--rosa-bg); }
.metric-label-disp { font-size: 11px; color: var(--gris-mid); margin-bottom: 6px; padding-right: 48px; font-weight: 600; letter-spacing: 0.03em; }
.metric-val-row { display: flex; align-items: baseline; gap: 4px; }
.metric-val-input { font-size: 22px; font-weight: 700; color: var(--gris); background: transparent; border: none; border-bottom: 2px solid var(--gris-border); width: 90px; outline: none; font-family: inherit; }
.metric-val-input:focus { border-bottom-color: var(--rosa); }
.metric-unit-disp { font-size: 12px; color: var(--gris-mid); }
.metric-prev-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.metric-prev-input { font-size: 11px; background: transparent; border: none; border-bottom: 1px dashed var(--gris-border); width: 65px; outline: none; color: #aaa; font-family: inherit; }
.metric-prev-input::placeholder { color: #ccc; }
.delta-badge { font-size: 10px; padding: 2px 6px; border-radius: 100px; font-weight: 700; }
.delta-good { background: #eaf3de; color: #3b6d11; }
.delta-bad  { background: #fcebeb; color: #a32d2d; }

/* Metric edit form */
.metric-card.editing { border-top-color: var(--gris); background: var(--gris-light); }
.metric-edit-form { display: flex; flex-direction: column; gap: 8px; }
.edit-field-label { font-size: 10px; color: var(--gris-mid); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.edit-text-input { font-size: 13px; padding: 6px 9px; border: 1px solid var(--gris-border); border-radius: 7px; background: var(--white); font-family: inherit; width: 100%; outline: none; }
.edit-text-input:focus { border-color: var(--rosa); }
.edit-toggle { display: flex; gap: 5px; }
.toggle-btn { flex: 1; font-size: 11px; padding: 5px 8px; border: 1px solid var(--gris-border); border-radius: 7px; cursor: pointer; background: var(--white); color: var(--gris-mid); font-family: inherit; text-align: center; }
.toggle-btn.sel { background: var(--rosa); color: var(--white); border-color: var(--rosa); }
.edit-actions { display: flex; gap: 6px; margin-top: 2px; }
.btn-save { flex: 1; font-size: 12px; padding: 7px; background: var(--gris); color: var(--white); border: none; border-radius: 7px; cursor: pointer; font-family: inherit; }
.btn-save:hover { background: var(--rosa); }
.btn-cancel { font-size: 12px; padding: 7px 12px; background: var(--gris-light); color: var(--gris-mid); border: none; border-radius: 7px; cursor: pointer; font-family: inherit; }

/* Add metric */
.add-metric-btn { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 8px 14px; background: var(--white); border: 1px dashed var(--rosa-light); border-radius: 9px; cursor: pointer; color: var(--rosa); width: 100%; justify-content: center; margin-bottom: 1.5rem; transition: all 0.15s; font-weight: 600; }
.add-metric-btn:hover { background: var(--rosa-bg); border-color: var(--rosa); }
.add-metric-form { background: var(--white); border: 1px solid var(--rosa); border-radius: 10px; padding: 16px; margin-bottom: 1.5rem; }
.add-metric-form h4 { font-size: 12px; font-weight: 700; margin-bottom: 12px; color: var(--gris); }
.form-grid { display: grid; grid-template-columns: 1fr 80px; gap: 8px; margin-bottom: 8px; }
.form-label { font-size: 10px; color: var(--gris-mid); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.form-input { font-size: 13px; padding: 7px 10px; border: 1px solid var(--gris-border); border-radius: 7px; background: var(--white); font-family: inherit; width: 100%; outline: none; }
.form-input:focus { border-color: var(--rosa); }
.direction-row { margin-bottom: 10px; }
.direction-btns { display: flex; gap: 6px; }
.dir-btn { flex: 1; font-size: 12px; padding: 7px; border: 1px solid var(--gris-border); border-radius: 7px; cursor: pointer; background: var(--white); color: var(--gris-mid); font-family: inherit; }
.dir-btn.sel { background: var(--rosa); color: var(--white); border-color: var(--rosa); }
.form-actions { display: flex; gap: 7px; }
.btn-primary { flex: 1; font-size: 13px; padding: 8px; background: var(--gris); color: var(--white); border: none; border-radius: 7px; cursor: pointer; font-family: inherit; }
.btn-primary:hover { background: var(--rosa); }
.btn-secondary { font-size: 13px; padding: 8px 14px; background: var(--gris-light); color: var(--gris-mid); border: none; border-radius: 7px; cursor: pointer; font-family: inherit; }

/* Avances */
.avances-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
.avance-row { background: var(--white); border: 1px solid var(--gris-border); border-left: 3px solid var(--rosa-light); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.avance-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.avance-body { flex: 1; }
.avance-title { font-size: 13px; font-weight: 600; color: var(--gris); }
.avance-sub { font-size: 12px; color: var(--gris-mid); margin-top: 1px; }
.avance-arrow { font-size: 18px; }
.empty-state { text-align: center; padding: 1.5rem; color: #ccc; font-size: 13px; background: var(--gris-light); border: 1px dashed var(--gris-border); border-radius: 10px; margin-bottom: 1.5rem; }

/* Items */
.items-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 1.25rem; }
.item-row { background: var(--white); border: 1px solid var(--gris-border); border-radius: 10px; padding: 11px 14px; display: flex; align-items: flex-start; gap: 10px; }
.item-row:hover { border-color: var(--rosa-light); }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 13px; font-weight: 600; color: var(--gris); }
.item-desc { font-size: 12px; color: var(--gris-mid); margin-top: 2px; }
.item-meta { display: flex; gap: 6px; margin-top: 5px; }
.badge { font-size: 11px; padding: 2px 9px; border-radius: 100px; font-weight: 600; }
.badge-amarillo { background: #FFF3E0; color: #E65100; }
.badge-azul     { background: #E3F2FD; color: #1565C0; }
.badge-verde    { background: #E8F5E9; color: #2E7D32; }
.badge-rojo     { background: #FFEBEE; color: #C62828; }
.status-sel { font-size: 12px; border: 1px solid var(--gris-border); background: var(--gris-light); color: var(--gris); border-radius: 7px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; font-family: inherit; }
.status-sel:focus { border-color: var(--rosa); outline: none; }
.del-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 18px; flex-shrink: 0; padding: 0 4px; line-height: 1; }
.del-btn:hover { color: var(--rosa-dark); }

/* Add form */
.add-form { background: var(--rosa-bg); border: 1px solid var(--rosa-light); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-row input, .add-row select { font-size: 12px; padding: 7px 10px; flex: 1; min-width: 120px; background: var(--white); border: 1px solid var(--gris-border); border-radius: 7px; color: var(--text); font-family: inherit; outline: none; }
.add-row input:focus { border-color: var(--rosa); }
.add-row button { padding: 7px 14px; font-size: 12px; background: var(--rosa); color: var(--white); border: none; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; font-family: inherit; font-weight: 600; }
.add-row button:hover { background: var(--rosa-dark); }

/* Resumen */
.resumen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.resumen-card { background: var(--white); border: 1px solid var(--gris-border); border-radius: 12px; padding: 16px; border-top: 3px solid var(--gris-border); }
.resumen-card.s-verde-card  { border-top-color: #4CAF50; }
.resumen-card.s-amarillo-card { border-top-color: #FF9800; }
.resumen-card.s-rojo-card   { border-top-color: #F44336; }
.resumen-card-title { font-size: 12px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; color: var(--gris); letter-spacing: 0.02em; text-transform: uppercase; }
.semaforo { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.s-verde    { background: #4CAF50; }
.s-amarillo { background: #FF9800; }
.s-rojo     { background: #F44336; }
.resumen-metric { font-size: 12px; color: var(--gris-mid); padding: 3px 0; display: flex; justify-content: space-between; border-bottom: 1px solid var(--gris-light); }
.resumen-metric:last-of-type { border-bottom: none; }
.resumen-metric span:last-child { font-weight: 700; color: var(--gris); }
.progress-wrap { background: var(--gris-light); border-radius: 100px; height: 5px; overflow: hidden; margin-top: 8px; }
.progress-bar { height: 5px; border-radius: 100px; transition: width 0.3s; }
.pct-label { font-size: 11px; color: #aaa; margin-top: 3px; text-align: right; }

/* Detalle de pagos */
.pagos-box { background: var(--white); border: 1px solid var(--gris-border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
.pagos-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--gris-border); background: var(--gris-light); }
.pagos-header-title { font-size: 12px; font-weight: 700; color: var(--gris); display: flex; align-items: center; gap: 7px; letter-spacing: 0.03em; }
.pagos-total-pill { font-size: 13px; font-weight: 700; color: var(--white); background: var(--rosa); border-radius: 8px; padding: 4px 12px; letter-spacing: -0.01em; }
.pagos-table { width: 100%; border-collapse: collapse; }
.pagos-table th { font-size: 10px; font-weight: 700; color: var(--gris-mid); text-transform: uppercase; letter-spacing: 0.07em; padding: 8px 14px; text-align: left; border-bottom: 1px solid var(--gris-border); background: var(--gris-light); }
.pagos-table th:last-child { text-align: right; }
.pagos-table td { font-size: 13px; padding: 10px 14px; border-bottom: 1px solid #fafafa; vertical-align: middle; color: var(--gris); }
.pagos-table td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.pagos-table tr:last-child td { border-bottom: none; }
.pagos-table tr:hover td { background: var(--rosa-bg); }
.pago-concepto { font-size: 13px; font-weight: 600; }
.pago-beneficiario { font-size: 11px; color: var(--gris-mid); margin-top: 1px; }
.pago-fecha-badge { font-size: 11px; padding: 3px 8px; background: var(--gris-light); color: var(--gris-mid); border-radius: 6px; white-space: nowrap; }
.pago-urgente    { background: #FFEBEE; color: #C62828; }
.pago-programado { background: #FFF3E0; color: #E65100; }
.pago-pagado     { background: #E8F5E9; color: #2E7D32; }
.pagos-add-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 14px; background: var(--rosa-bg); border-top: 1px solid var(--rosa-light); }
.pagos-add-row input, .pagos-add-row select { font-size: 12px; padding: 7px 10px; background: var(--white); border: 1px solid var(--gris-border); border-radius: 7px; color: var(--text); font-family: inherit; outline: none; }
.pagos-add-row input:focus, .pagos-add-row select:focus { border-color: var(--rosa); }
.p-concepto { flex: 2; min-width: 130px; }
.p-benef { flex: 1.5; min-width: 110px; }
.p-monto { width: 110px; }
.p-fecha { width: 130px; }
.p-tipo { width: 120px; }
.p-add-btn { padding: 7px 14px; font-size: 12px; background: var(--rosa); color: var(--white); border: none; border-radius: 7px; cursor: pointer; white-space: nowrap; font-family: inherit; font-weight: 600; }
.p-add-btn:hover { background: var(--rosa-dark); }
.pago-del { background: none; border: none; cursor: pointer; color: #ddd; font-size: 16px; padding: 0 4px; line-height: 1; }
.pago-del:hover { color: var(--rosa-dark); }
.pagos-empty { padding: 20px; text-align: center; font-size: 12px; color: #ccc; }
.pagos-linked-note { font-size: 11px; color: var(--gris-mid); display: flex; align-items: center; gap: 5px; padding: 8px 16px; border-top: 1px solid var(--gris-border); background: #FFFDE7; }

/* Saldos */
.saldos-box { background: var(--white); border: 1px solid var(--gris-border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
.saldos-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--gris-border); background: var(--gris-light); }
.saldos-header-title { font-size: 12px; font-weight: 700; color: var(--gris); }
.saldos-total-pill { font-size: 13px; font-weight: 700; color: var(--white); background: var(--rosa); border-radius: 8px; padding: 4px 12px; }
.saldos-table { width: 100%; border-collapse: collapse; }
.saldos-table th { font-size: 10px; font-weight: 700; color: var(--gris-mid); text-transform: uppercase; letter-spacing: 0.07em; padding: 8px 16px; text-align: left; border-bottom: 1px solid var(--gris-border); background: var(--gris-light); }
.saldos-table th.th-right { text-align: right; padding-right: 14px; }
.saldos-table td { border-bottom: 1px solid #fafafa; vertical-align: middle; }
.saldos-table tr:not(.saldos-total-row):hover td { background: var(--rosa-bg); }
.saldo-cuenta-cell { padding: 9px 16px; }
.saldo-cuenta { display: flex; align-items: center; gap: 9px; }
.saldo-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.saldo-nombre { font-size: 13px; font-weight: 600; color: var(--gris); }
.saldo-input-cell { padding: 6px 14px 6px 0; text-align: right; }
.saldo-input { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; background: transparent; border: none; border-bottom: 2px solid var(--gris-border); width: 145px; outline: none; font-family: inherit; color: var(--gris); padding: 3px 4px; }
.saldo-input:focus { border-bottom-color: var(--rosa); }
.saldo-input::placeholder { color: #ccc; font-weight: 400; font-size: 12px; }
.saldos-total-row td { background: var(--gris) !important; }
.saldos-total-label { font-size: 12px; font-weight: 700; color: var(--white); padding: 11px 16px; letter-spacing: 0.04em; text-transform: uppercase; }
.saldos-total-value { font-size: 18px; font-weight: 700; color: var(--rosa-light); font-variant-numeric: tabular-nums; padding: 11px 14px 11px 0; text-align: right; }
.saldos-linked-note { font-size: 11px; color: var(--gris-mid); display: flex; align-items: center; gap: 5px; padding: 8px 16px; border-top: 1px solid var(--gris-border); background: #FFFDE7; }

/* Reportes */
.reportes-box { background: var(--white); border: 1px solid var(--gris-border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; }
.reportes-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--gris-light); border-bottom: 1px solid var(--gris-border); flex-wrap: wrap; }
.reportes-toolbar-title { font-size: 12px; font-weight: 700; color: var(--gris); flex: 1; letter-spacing: 0.03em; }
.upload-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 7px 14px; background: var(--rosa); color: var(--white); border: none; border-radius: 7px; cursor: pointer; font-family: inherit; white-space: nowrap; font-weight: 600; }
.upload-btn:hover { background: var(--rosa-dark); }
.reportes-tabs { display: flex; gap: 1px; border-bottom: 1px solid var(--gris-border); overflow-x: auto; min-height: 38px; background: var(--gris-light); }
.reporte-tab { display: flex; align-items: center; gap: 7px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--gris-mid); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; background: transparent; border-top: none; border-left: none; border-right: none; font-family: inherit; transition: all 0.12s; flex-shrink: 0; }
.reporte-tab:hover { color: var(--gris); background: var(--rosa-bg); }
.reporte-tab.active { color: var(--rosa); border-bottom-color: var(--rosa); background: var(--white); }
.reporte-tab-icon { font-size: 14px; }
.reporte-tab-close { font-size: 15px; color: #bbb; margin-left: 4px; line-height: 1; padding: 0 2px; background: none; border: none; cursor: pointer; font-family: inherit; border-radius: 3px; }
.reporte-tab-close:hover { color: var(--rosa-dark); background: var(--rosa-bg); }
.reportes-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 2rem; color: #ccc; gap: 10px; }
.reportes-empty-icon { font-size: 36px; }
.reportes-empty-text { font-size: 13px; text-align: center; line-height: 1.5; }
.reportes-viewer { min-height: 420px; }
.viewer-frame { width: 100%; height: 580px; border: none; display: block; }
.viewer-img { max-width: 100%; max-height: 580px; display: block; margin: 0 auto; padding: 12px; }
.viewer-excel { padding: 16px; }
.excel-table-wrap { overflow-x: auto; }
.excel-table { border-collapse: collapse; font-size: 12px; min-width: 100%; }
.excel-table th { background: var(--gris); color: var(--white); font-weight: 700; padding: 6px 10px; border: 1px solid var(--gris-mid); text-align: left; white-space: nowrap; }
.excel-table td { padding: 5px 10px; border: 1px solid var(--gris-border); color: var(--gris); white-space: nowrap; }
.excel-table tr:nth-child(even) td { background: var(--rosa-bg); }
.excel-sheet-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.excel-sheet-btn { font-size: 11px; padding: 4px 10px; border: 1px solid var(--gris-border); border-radius: 6px; background: var(--white); cursor: pointer; font-family: inherit; color: var(--gris-mid); }
.excel-sheet-btn.active { background: var(--rosa); color: var(--white); border-color: var(--rosa); }

};

// editing state per area: null | index
const editingMetric = { contabilidad: null, facturacion: null, tesoreria: null, gerencia: null, rrhh: null, cxc: null, compras: null };
// show add form per area
const showingAddMetric = { contabilidad: false, facturacion: false, tesoreria: false, gerencia: false, rrhh: false, cxc: false, compras: false };
// temp values for new metric direction toggle
const newMetricDir = { contabilidad: false, facturacion: true, tesoreria: true, gerencia: false, rrhh: true, cxc: false, compras: true };

function delta(m) {
  const v = parseFloat(m.val), p = parseFloat(m.prev);
  if (isNaN(v) || isNaN(p) || p === 0) return null;
  const pct = Math.round(((v - p) / Math.abs(p)) * 100);
  const up = v > p;
  const good = m.upIsGood ? up : !up;
  return { pct, up, good };
}

// ── Metric card: vista normal ──────────────────────────────────────
function metricCardView(area, i) {
  const m = AREAS[area].metrics[i];
  const d = delta(m);
  let badge = '';
  if (d !== null) {
    const cls = d.good ? 'delta-good' : 'delta-bad';
    badge = `<span class="delta-badge ${cls}">${d.up ? '▲' : '▼'} ${Math.abs(d.pct)}%</span>`;
  }
  return `
    <div class="metric-card" id="mc-${area}-${i}">
      <button class="metric-del-btn" onclick="deleteMetric('${area}',${i})" title="Eliminar métrica">×</button>
      <button class="metric-edit-btn" onclick="startEditMetric('${area}',${i})" title="Editar métrica">✎</button>
      <div class="metric-label-disp">${m.label}</div>
      <div class="metric-val-row">
        <input type="text" class="metric-val-input" placeholder="—" value="${m.val}"
          oninput="AREAS['${area}'].metrics[${i}].val=this.value;syncMetricCard('${area}',${i});renderResumen()">
        <span class="metric-unit-disp">${m.unit}</span>
      </div>
      <div class="metric-prev-row">
        <input type="text" class="metric-prev-input" placeholder="sem. ant." value="${m.prev}"
          oninput="AREAS['${area}'].metrics[${i}].prev=this.value;syncMetricCard('${area}',${i});renderResumen()">
        ${badge}
      </div>
    </div>`;
}

// ── Metric card: modo edición ──────────────────────────────────────
function metricCardEdit(area, i) {
  const m = AREAS[area].metrics[i];
  const yesClass = m.upIsGood ? 'sel' : '';
  const noClass  = !m.upIsGood ? 'sel' : '';
  return `
    <div class="metric-card editing" id="mc-${area}-${i}">
      <div class="metric-edit-form">
        <div>
          <div class="edit-field-label">Nombre de la métrica</div>
          <input type="text" class="edit-text-input" id="edit-label-${area}-${i}" value="${m.label}">
        </div>
        <div>
          <div class="edit-field-label">Unidad</div>
          <input type="text" class="edit-text-input" id="edit-unit-${area}-${i}" value="${m.unit}" placeholder="$, días, fac., %…" style="width:100px;">
        </div>
        <div>
          <div class="edit-field-label">¿Subir es bueno?</div>
          <div class="edit-toggle">
            <button class="toggle-btn ${yesClass}" id="edit-up-yes-${area}-${i}"
              onclick="setEditDir('${area}',${i},true)">↑ Sí</button>
            <button class="toggle-btn ${noClass}" id="edit-up-no-${area}-${i}"
              onclick="setEditDir('${area}',${i},false)">↓ No</button>
          </div>
        </div>
        <div class="edit-actions">
          <button class="btn-save" onclick="saveEditMetric('${area}',${i})">Guardar</button>
          <button class="btn-cancel" onclick="cancelEditMetric('${area}',${i})">Cancelar</button>
        </div>
      </div>
    </div>`;
}

function setEditDir(area, i, val) {
  AREAS[area].metrics[i].upIsGood = val;
  document.getElementById(`edit-up-yes-${area}-${i}`).className = 'toggle-btn' + (val ? ' sel' : '');
  document.getElementById(`edit-up-no-${area}-${i}`).className  = 'toggle-btn' + (!val ? ' sel' : '');
}

function startEditMetric(area, i) {
  editingMetric[area] = i;
  const card = document.getElementById(`mc-${area}-${i}`);
  card.outerHTML; // just to trigger
  replaceMetricCard(area, i, metricCardEdit(area, i));
}

function saveEditMetric(area, i) {
  const lbl = document.getElementById(`edit-label-${area}-${i}`).value.trim();
  const unit = document.getElementById(`edit-unit-${area}-${i}`).value.trim();
  if (lbl) AREAS[area].metrics[i].label = lbl;
  AREAS[area].metrics[i].unit = unit;
  editingMetric[area] = null;
  replaceMetricCard(area, i, metricCardView(area, i));
  refreshAvances(area);
  renderResumen();
}

function cancelEditMetric(area, i) {
  editingMetric[area] = null;
  replaceMetricCard(area, i, metricCardView(area, i));
}

function replaceMetricCard(area, i, html) {
  const old = document.getElementById(`mc-${area}-${i}`);
  if (!old) return;
  old.outerHTML = html;
}

function syncMetricCard(area, i) {
  // Just re-render the badge without touching the inputs
  const m = AREAS[area].metrics[i];
  const d = delta(m);
  let badge = '';
  if (d !== null) {
    const cls = d.good ? 'delta-good' : 'delta-bad';
    badge = `<span class="delta-badge ${cls}">${d.up ? '▲' : '▼'} ${Math.abs(d.pct)}%</span>`;
  }
  const prevRow = document.querySelector(`#mc-${area}-${i} .metric-prev-row`);
  if (prevRow) {
    const existing = prevRow.querySelector('.delta-badge');
    if (existing) existing.remove();
    if (badge) prevRow.insertAdjacentHTML('beforeend', badge);
  }
  refreshAvances(area);
  if (area !== 'gerencia') calcGerenciaMetrics();
}

function deleteMetric(area, i) {
  if (!confirm('¿Eliminar esta métrica?')) return;
  AREAS[area].metrics.splice(i, 1);
  refreshMetricsSection(area);
  refreshAvances(area);
  renderResumen();
}

// ── Add metric form ────────────────────────────────────────────────
function setNewDir(area, val) {

function addMetricForm(area) {

}

// ── Auto-cálculo métricas Gerencia ────────────────────────────────
function calcGerenciaMetrics() {
  const areas = ['contabilidad','facturacion','tesoreria','rrhh','cxc','compras'];
  const promedios = [];
  let enMeta = 0, enRiesgo = 0;

  areas.forEach(area => {
    const vals = AREAS[area].metrics
      .filter(m => m.unit === '%' && m.val !== '')
      .map(m => parseFloat(m.val));
    if (vals.length > 0) {
      const prom = vals.reduce((a,b) => a+b, 0) / vals.length;
      promedios.push(prom);
      if (prom >= 90) enMeta++;
      if (prom < 70)  enRiesgo++;
    }
  });

  const g = AREAS.gerencia.metrics;
  const promGeneral = promedios.length > 0
    ? Math.round(promedios.reduce((a,b) => a+b, 0) / promedios.length)
    : '';

  // Promedio general
  const i0 = g.findIndex(m => m.autoCalc && m.label.includes('Promedio'));
  if (i0 >= 0) g[i0].val = promGeneral !== '' ? String(promGeneral) : '';

  // Áreas en meta
  const i1 = g.findIndex(m => m.autoCalc && m.label.includes('meta'));
  if (i1 >= 0) g[i1].val = promedios.length > 0 ? String(enMeta) : '';

  // Áreas en riesgo
  const i2 = g.findIndex(m => m.autoCalc && m.label.includes('riesgo'));
  if (i2 >= 0) g[i2].val = promedios.length > 0 ? String(enRiesgo) : '';

  // Refresh gerencia panel if visible
  const panel = document.getElementById('panel-gerencia');
  if (panel && panel.classList.contains('active')) {
    panel.innerHTML = renderAreaPanel('gerencia');
  }
  renderResumen();
}

// ── Visor de reportes (Gerencia) ───────────────────────────────────
const reportes = [];      // { name, type, dataUrl, workbook? }
let activeReporte = null;

const EXT_ICONS = {
  pdf: '📄', png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', webp: '🖼',
  xlsx: '📊', xls: '📊', csv: '📊'
};

function extOf(name) { return name.split('.').pop().toLowerCase(); }
function iconOf(name) { const e = extOf(name); return EXT_ICONS[e] || '📎'; }
function isImage(name) { return ['png','jpg','jpeg','gif','webp'].includes(extOf(name)); }
function isExcel(name) { return ['xlsx','xls','csv'].includes(extOf(name)); }
function isPDF(name)   { return extOf(name) === 'pdf'; }

function openFilePicker() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.pdf,.png,.jpg,.jpeg,.gif,.webp,.xlsx,.xls,.csv';
  inp.multiple = true;
  inp.onchange = e => loadFiles(Array.from(e.target.files));
  inp.click();
}

function loadFiles(files) {
  let pending = files.length;
  if (!pending) return;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = ev => {
      const entry = { name: file.name, type: extOf(file.name), dataUrl: ev.target.result };
      if (isExcel(file.name)) {
        try {
          const wb = XLSX.read(ev.target.result.split(',')[1], { type: 'base64' });
          entry.workbook = wb;
          entry.activeSheet = wb.SheetNames[0];
        } catch(e) {}
      }
      reportes.push(entry);
      pending--;
      if (pending === 0) {
        activeReporte = reportes[reportes.length - 1].name;
        refreshReportesSection();
      }
    };
    reader.readAsDataURL(file);
  });
}

function setActiveReporte(name) {
  activeReporte = name;
  refreshReportesSection();
}

function setActiveReporteIdx(idx) {
  if (reportes[idx]) { activeReporte = reportes[idx].name; refreshReportesSection(); }
}

function removeReporte(name) {
  const idx = reportes.findIndex(r => r.name === name);
  if (idx >= 0) reportes.splice(idx, 1);
  if (activeReporte === name) activeReporte = reportes.length ? reportes[reportes.length-1].name : null;
  refreshReportesSection();
}

function removeReporteIdx(idx) {
  if (!reportes[idx]) return;
  const name = reportes[idx].name;
  reportes.splice(idx, 1);
  if (activeReporte === name) activeReporte = reportes.length ? reportes[reportes.length-1].name : null;
  refreshReportesSection();
}

function setExcelSheet(reporteName, sheetName) {
  const r = reportes.find(x => x.name === reporteName);
  if (r) r.activeSheet = sheetName;
  refreshViewerOnly();
}

function setExcelSheetIdx(idx, sheetName) {
  if (reportes[idx]) { reportes[idx].activeSheet = sheetName; refreshViewerOnly(); }
}

function setExcelSheetByIndex(rIdx, sheetIdx) {
  if (reportes[rIdx] && reportes[rIdx].workbook) {
    reportes[rIdx].activeSheet = reportes[rIdx].workbook.SheetNames[sheetIdx];
    refreshViewerOnly();
  }
}

function refreshReportesSection() {
  const el = document.getElementById('reportes-section');
  if (el) el.innerHTML = renderReportesBlock();
}

function refreshViewerOnly() {
  const el = document.getElementById('reportes-viewer-content');
  if (el) el.innerHTML = renderViewer();
}

function renderReportesBlock() {
  const tabs = reportes.length === 0 ? '' : reportes.map((r, idx) => `
    <button class="reporte-tab${r.name === activeReporte ? ' active' : ''}" onclick="setActiveReporteIdx(${idx})">
      <span class="reporte-tab-icon">${iconOf(r.name)}</span>
      ${r.name.length > 22 ? r.name.substring(0,20)+'…' : r.name}
      <button class="reporte-tab-close" onclick="event.stopPropagation();removeReporteIdx(${idx})">×</button>
    </button>`).join('');

  const viewer = reportes.length === 0
    ? `<div class="reportes-empty">
        <div class="reportes-empty-icon">📂</div>
        <div class="reportes-empty-text">Carga reportes con el botón de arriba<br>PDF, Excel, CSV e imágenes</div>
       </div>`
    : `<div id="reportes-viewer-content">${renderViewer()}</div>`;

  return `
    <div class="reportes-box">
      <div class="reportes-toolbar">
        <span class="reportes-toolbar-title">📋 Reportes de Gerencia</span>
        <button class="upload-btn" onclick="openFilePicker()">+ Cargar reporte</button>
      </div>
      ${reportes.length > 0 ? `<div class="reportes-tabs">${tabs}</div>` : ''}
      <div class="reportes-viewer">${viewer}</div>
    </div>`;
}

function renderViewer() {
  const r = reportes.find(x => x.name === activeReporte);
  if (!r) return '';

  if (isPDF(r.name)) {
    return `<iframe class="viewer-frame" src="${r.dataUrl}"></iframe>`;
  }
  if (isImage(r.name)) {
    return `<img class="viewer-img" src="${r.dataUrl}" alt="${r.name}">`;
  }
  if (isExcel(r.name) && r.workbook) {
    const wb = r.workbook;
    const sheetName = r.activeSheet || wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const html = XLSX.utils.sheet_to_html(ws, { editable: false });
    const ridx = reportes.indexOf(r);
    const sheetTabs = wb.SheetNames.length > 1
      ? `<div class="excel-sheet-tabs">${wb.SheetNames.map((s,si) =>
          `<button class="excel-sheet-btn${s===sheetName?' active':''}" onclick="setExcelSheetByIndex(${ridx},${si})">${s}</button>`
        ).join('')}</div>`
      : '';
    // Style the raw html table
    const styledHtml = html
      .replace('<table>', '<table class="excel-table">')
      .replace(/<td/g, '<td')
      .replace(/<th/g, '<th');
    return `<div class="viewer-excel">${sheetTabs}<div class="excel-table-wrap">${styledHtml}</div></div>`;
  }
  return `<div class="viewer-unsupported">📎 Vista previa no disponible para este formato<br><small>${r.name}</small></div>`;
}

function renderAreaPanel(area) {
  const saldosSection = area === 'tesoreria' ? `
    <hr class="divider">
    <p class="section-title">Saldos disponibles <span class="section-note">— la suma alimenta automáticamente la métrica "Saldo disponible"</span></p>
    <div id="saldos-section">${renderSaldosBlock()}</div>
  ` : '';

  const pagosSection = area === 'tesoreria' ? `
    <hr class="divider">
    <p class="section-title">Detalle de pagos <span class="section-note">— la suma alimenta automáticamente la métrica "Pagos urgentes"</span></p>
    <div id="pagos-section">${renderPagosBlock()}</div>
  ` : '';

  const reportesSection = area === 'gerencia' ? `
    <hr class="divider">
    <p class="section-title">Reportes <span class="section-note">— carga PDF, Excel, CSV o imágenes para visualizarlos aquí</span></p>
    <div id="reportes-section">${renderReportesBlock()}</div>
  ` : '';

  return `
    <div class="panel-inner">
    <p class="section-title">Métricas clave <span class="section-note">— edita nombre/unidad con ✎, captura valor actual y semana anterior</span></p>
    <div id="metrics-section-${area}">
      ${renderMetricsGrid(area)}
      ${addMetricForm(area)}
    </div>
    <hr class="divider">
    <p class="section-title">Avances y resultados <span class="section-note">— generados desde métricas</span></p>
    <div id="avances-section-${area}">${renderAvancesHTML(area)}</div>
    ${saldosSection}
    ${pagosSection}
    ${reportesSection}
    <hr class="divider">
    <p class="section-title">Pendientes</p>
    ${addForm(area, 'pendientes')}
    <div id="items-${area}-pendientes">${renderItemsList(area, 'pendientes')}</div>
    <hr class="divider">
    <p class="section-title">Compromisos</p>
    ${addForm(area, 'compromisos')}
    <div id="items-${area}-compromisos">${renderItemsList(area, 'compromisos')}</div>
    </div>
  `;
}

// ── Resumen ────────────────────────────────────────────────────────
function semaforo(area) {
  const a = AREAS[area];
  const all = [...a.pendientes, ...a.compromisos];
  if (all.some(i => i.status === 'bloqueado')) return 's-rojo';
  if (all.length === 0) return a.metrics.some(m => m.val !== '') ? 's-verde' : 's-amarillo';
  const pct = all.filter(i => i.status === 'completado').length / all.length;
  return pct >= 0.6 ? 's-verde' : pct >= 0.3 ? 's-amarillo' : 's-rojo';
}

function renderResumen() {
  const order = ['contabilidad','facturacion','tesoreria','gerencia','rrhh','cxc','compras'];
  const cards = order.map(area => {
    const a = AREAS[area];
    const s = semaforo(area);
    const all = [...a.pendientes, ...a.compromisos];
    const done = all.filter(i => i.status === 'completado').length;
    const pct = all.length > 0 ? Math.round((done / all.length) * 100) : 0;
    const barColor = s === 's-verde' ? '#639922' : s === 's-amarillo' ? '#ba7517' : '#a32d2d';
    const metricRows = a.metrics.filter(m => m.val !== '').map(m => {
      const d = delta(m);
      const ds = d !== null ? ` <span style="color:${d.good?'#639922':'#a32d2d'};font-size:10px;">${d.up?'▲':'▼'}${Math.abs(d.pct)}%</span>` : '';
      return `<div class="resumen-metric"><span>${m.label}</span><span>${m.val}${m.unit?' '+m.unit:''}${ds}</span></div>`;
    }).join('');
    return `
      <div class="resumen-card ${s}-card">
        <div class="resumen-card-title"><span class="semaforo ${s}"></span>${a.label}</div>
        ${metricRows || '<div style="font-size:12px;color:#ccc;margin-bottom:6px;">Sin métricas registradas</div>'}
        ${all.length > 0 ? `<div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;background:${barColor};"></div></div><div class="pct-label">${done}/${all.length} completados</div>` : ''}
      </div>`;
  }).join('');

  const allComps = [];
  order.forEach(area => AREAS[area].compromisos.filter(c => c.status !== 'completado').forEach(c => allComps.push({ ...c, areaLabel: AREAS[area].label })));
  const compHTML = allComps.length === 0
    ? `<div class="empty-state">✓ Sin compromisos pendientes</div>`
    : `<div class="items-list">` + allComps.map(c => {
        const s = STATUS_MAP[c.status];
        return `<div class="item-row"><div class="item-body"><div class="item-title">${c.titulo}</div><div class="item-desc">${c.areaLabel}${c.responsable?' · '+c.responsable:''}${c.fecha?' · '+c.fecha:''}</div><div class="item-meta"><span class="badge ${s.cls}">${s.label}</span></div></div></div>`;
      }).join('') + `</div>`;

  document.getElementById('panel-resumen').innerHTML = `
    <div class="panel-inner">
    <p class="section-title">Estado por área</p>
    <div class="resumen-grid">${cards}</div>
    <hr class="divider">
    <p class="section-title">Compromisos abiertos</p>
    ${compHTML}
    </div>
  `;
}

function showTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const panel = document.getElementById('panel-' + name);
  panel.classList.add('active');
  btn.classList.add('active');
  if (name === 'buzon') { renderBuzon(); return; }
  if (name !== 'resumen' && panel.innerHTML.trim() === '') panel.innerHTML = renderAreaPanel(name);
  if (name === 'resumen') renderResumen();
}



// ── Configuracion GitHub ─────────────────────────────────────────
const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/Dianavilla050/Tablero-FirmagasMetricas/main/datos';
const GITHUB_USER_CFG = 'Dianavilla050';
const GITHUB_REPO_CFG = 'Tablero-FirmagasMetricas';

const buzonMensajes = [];
const buzonBorradores = {};
let buzonTabActiva = 'director';

const TODAS_AREAS_LABELS = {
  contabilidad: 'Contabilidad', facturacion: 'Facturacion',
  tesoreria: 'Tesoreria / Finanzas', gerencia: 'Gerencia',
  rrhh: 'Recursos Humanos', cxc: 'Cuentas por Cobrar', compras: 'Compras'
};

async function cargarListaSemanas() {
  const sel = document.getElementById('gh-semana-sel');
  const status = document.getElementById('gh-status');
  try {
    const apiUrl = 'https://api.github.com/repos/' + GITHUB_USER_CFG + '/' + GITHUB_REPO_CFG + '/contents/datos';
    const res = await fetch(apiUrl);
    if (!res.ok) throw new Error('No se pudo leer el repositorio');
    const files = await res.json();
    const jsons = Array.isArray(files) ? files.filter(f => f.name.endsWith('.json') && f.name.startsWith('tablero_')) : [];
    sel.innerHTML = '<option value="">— Selecciona una semana —</option>';
    jsons.sort((a,b) => b.name.localeCompare(a.name)).forEach(f => {
      const label = f.name.replace('tablero_','').replace('.json','').replace(/_/g,' ');
      const opt = document.createElement('option');
      opt.value = f.download_url;
      opt.textContent = label;
      sel.appendChild(opt);
    });
    status.textContent = jsons.length > 0 ? jsons.length + ' semanas guardadas en GitHub' : 'Sin semanas guardadas aun — sube tu primer JSON a /datos';
  } catch(e) {
    status.textContent = 'Modo local — sin conexion a GitHub';
  }
}

async function cargarSemanaGitHub() {
  const sel = document.getElementById('gh-semana-sel');
  const url = sel.value;
  if (!url) { alert('Selecciona una semana primero'); return; }
  const status = document.getElementById('gh-status');
  status.textContent = 'Cargando...';
  try {
    const res = await fetch(url + '?nocache=' + Date.now());
    if (!res.ok) throw new Error('No se pudo cargar el archivo');
    const snap = await res.json();
    aplicarSnapshot(snap);
    status.textContent = 'Cargado: ' + (snap.semana || '');
  } catch(e) {
    alert('Error al cargar desde GitHub: ' + e.message);
    status.textContent = 'Error al cargar';
  }
}

function aplicarSnapshot(snap) {
  if (!snap.areas) { alert('Archivo no valido'); return; }
  if (snap.semana) document.getElementById('week-label').value = snap.semana;
  const allAreas = ['contabilidad','facturacion','tesoreria','gerencia','rrhh','cxc','compras'];
  allAreas.forEach(area => {
    if (!snap.areas[area]) return;
    const saved = snap.areas[area];
    if (saved.metrics) {
      saved.metrics.forEach((sm, i) => {
        if (AREAS[area].metrics[i]) {
          AREAS[area].metrics[i].val  = sm.val  || '';
          AREAS[area].metrics[i].prev = sm.prev || '';
        }
      });
    }
    AREAS[area].pendientes  = saved.pendientes  || [];
    AREAS[area].compromisos = saved.compromisos || [];
  });
  if (snap.tesoreria_saldos) {
    snap.tesoreria_saldos.forEach(s => {
      const found = AREAS.tesoreria.saldos.find(x => x.id === s.id);
      if (found) found.val = s.val || '';
    });
  }
  if (snap.tesoreria_pagos) AREAS.tesoreria.pagosDetalle = snap.tesoreria_pagos;
  colaboradores.length = 0;
  if (snap.colaboradores) {
    snap.colaboradores.forEach(c => colaboradores.push({
      id: c.id, nombre: c.nombre, puesto: c.puesto,
      criterios: c.criterios || CRITERIOS_EVAL.map(() => null),
      comentario: c.comentario || '', expandido: false
    }));
  }
  if (snap.evalIdCounter) evalIdCounter = snap.evalIdCounter;
  buzonMensajes.length = 0;
  if (snap.buzonMensajes) snap.buzonMensajes.forEach(m => buzonMensajes.push(m));
  allAreas.forEach(area => {
    const panel = document.getElementById('panel-' + area);
    if (panel) panel.innerHTML = renderAreaPanel(area);
  });
  renderPagosDetalle();
  syncSaldosToMetrica();
  syncPagosToMetrica();
  calcGerenciaMetrics();
  renderResumen();
  renderBuzon();
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-resumen').classList.add('active');
  document.querySelectorAll('.tab-btn')[1].classList.add('active');
}

function setBuzonTab(tab) { buzonTabActiva = tab; renderBuzon(); }
function setBuzonBorrador(area, val) { buzonBorradores[area] = val; }

function enviarComentarioDirector() {
  const semana = document.getElementById('week-label').value;
  let count = 0;
  Object.keys(TODAS_AREAS_LABELS).forEach(area => {
    const txt = (buzonBorradores[area] || '').trim();
    if (txt) {
      buzonMensajes.unshift({
        area: area, areaLabel: TODAS_AREAS_LABELS[area],
        texto: txt, semana: semana, fecha: new Date().toISOString()
      });
      buzonBorradores[area] = '';
      count++;
    }
  });
  if (count === 0) { alert('Escribe al menos un comentario antes de enviar'); return; }
  renderBuzon();
  alert(count + ' comentario(s) enviado(s) a G. Administrativa. Recuerda guardar el JSON para preservarlos.');
}

function renderBuzon() {
  const el = document.getElementById('panel-buzon');
  if (!el) return;

  const dirTab = buzonTabActiva === 'director';
  const areaRows = Object.entries(TODAS_AREAS_LABELS).map(([area, label]) =>
    '<div class="buzon-area-section">' +
    '<div class="buzon-area-title">' + label + '</div>' +
    '<textarea class="buzon-textarea" placeholder="Observaciones y mejoras para el area de ' + label + '..." ' +
    'oninput="setBuzonBorrador('' + area + '',this.value)">' + (buzonBorradores[area] || '') + '</textarea>' +
    '</div>'
  ).join('');

  const msgRows = buzonMensajes.length === 0
    ? '<div class="buzon-empty">Sin mensajes recibidos aun</div>'
    : buzonMensajes.map(m =>
        '<div class="buzon-msg-item">' +
        '<div class="buzon-msg-area">' + m.areaLabel + '</div>' +
        '<div class="buzon-msg-text">' + m.texto + '</div>' +
        '<div class="buzon-msg-meta">' + m.semana + ' · ' + new Date(m.fecha).toLocaleString('es-MX') + '</div>' +
        '</div>'
      ).join('');

  el.innerHTML =
    '<div class="panel-inner"><div class="buzon-box">' +
    '<div class="buzon-header"><span class="buzon-header-title">Buzon — Comentarios y Mejoras del Director</span></div>' +
    '<div class="buzon-tabs">' +
    '<button class="buzon-tab' + (dirTab ? ' active' : '') + '" onclick="setBuzonTab('director')">Vista Director — captura comentarios por area</button>' +
    '<button class="buzon-tab' + (!dirTab ? ' active' : '') + '" onclick="setBuzonTab('recibidos')">Recibidos por G. Administrativa (' + buzonMensajes.length + ')</button>' +
    '</div>' +
    '<div class="buzon-content">' +
    (dirTab
      ? areaRows +
        '<button class="buzon-send-btn" onclick="enviarComentarioDirector()">Enviar comentarios a G. Administrativa</button>' +
        '<div class="buzon-save-note">Los comentarios se preservan al dar clic en Guardar (descarga el JSON con todo incluido).</div>'
      : msgRows) +
    '</div></div></div>';
}

// ── Guardar / Cargar sesión ────────────────────────────────────────
function guardarSesion() {
  const semana = document.getElementById('week-label').value;
  const snapshot = {
    version: 1,
    semana,
    fecha: new Date().toISOString(),
    areas: {}
  };
  const allAreas = ['contabilidad','facturacion','tesoreria','gerencia','rrhh','cxc','compras'];
  allAreas.forEach(area => {
    snapshot.areas[area] = {
      metrics: AREAS[area].metrics.map(m => ({ label: m.label, unit: m.unit, val: m.val, prev: m.prev, upIsGood: m.upIsGood, ...(m.autoCalc ? {autoCalc: true} : {}) })),
      pendientes: AREAS[area].pendientes,
      compromisos: AREAS[area].compromisos,
    };
  });
  snapshot.tesoreria_saldos = AREAS.tesoreria.saldos.map(s => ({ id: s.id, val: s.val }));
  snapshot.tesoreria_pagos = AREAS.tesoreria.pagosDetalle;

  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const semanaSlug = semana.replace(/[^a-zA-Z0-9]/g, '_');
  a.href = url;
  a.download = `tablero_${semanaSlug}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function cargarSesion(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const snap = JSON.parse(e.target.result);
      if (!snap.areas) { alert('Archivo no válido'); return; }

      // Restore semana label
      if (snap.semana) document.getElementById('week-label').value = snap.semana;

      // Restore area data
      const allAreas = ['contabilidad','facturacion','tesoreria','gerencia','rrhh','cxc','compras'];
      allAreas.forEach(area => {
        if (!snap.areas[area]) return;
        const saved = snap.areas[area];
        // Merge metrics: keep structure, restore val/prev
        if (saved.metrics) {
          saved.metrics.forEach((sm, i) => {
            if (AREAS[area].metrics[i]) {
              AREAS[area].metrics[i].val  = sm.val  || '';
              AREAS[area].metrics[i].prev = sm.prev || '';
            }
          });
        }
        AREAS[area].pendientes  = saved.pendientes  || [];
        AREAS[area].compromisos = saved.compromisos || [];
      });

      // Restore saldos
      if (snap.tesoreria_saldos) {
        snap.tesoreria_saldos.forEach(s => {
          const found = AREAS.tesoreria.saldos.find(x => x.id === s.id);
          if (found) found.val = s.val || '';
        });
      }

      // Restore pagos
      if (snap.tesoreria_pagos) AREAS.tesoreria.pagosDetalle = snap.tesoreria_pagos;

      // Re-render everything
      allAreas.forEach(area => {
        const panel = document.getElementById('panel-' + area);
        if (panel) panel.innerHTML = renderAreaPanel(area);
      });
      renderPagosDetalle();
      syncSaldosToMetrica();
      syncPagosToMetrica();
      calcGerenciaMetrics();
      renderResumen();

      // Show resumen tab
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-resumen').classList.add('active');
      document.querySelector('.tab-btn').classList.add('active');

      alert('✓ Sesión cargada: ' + (snap.semana || '') + (snap.fecha ? '\nGuardada el ' + new Date(snap.fecha).toLocaleString('es-MX') : ''));
    } catch(err) {
      alert('Error al leer el archivo: ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

['contabilidad','facturacion','tesoreria','gerencia','rrhh','cxc','compras'].forEach(a => {
  document.getElementById('panel-' + a).innerHTML = renderAreaPanel(a);
